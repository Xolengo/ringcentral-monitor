name: RingCentral Call Log

on:
  workflow_dispatch:

jobs:
  calllog:
    runs-on: ubuntu-latest

    steps:

    - name: Consultar y resumir llamadas
      run: |
        RESPONSE=$(curl -s \
        "https://platform.ringcentral.com/restapi/v1.0/account/~/extension/~/call-log?view=Simple" \
        -H "Authorization: Bearer ${{ secrets.RINGCENTRAL_ACCESS_TOKEN }}")

        echo "$RESPONSE" > calls.json

        echo "===== RESUMEN ====="

        jq '.records[] | {
          fecha: .startTime,
          direccion: .direction,
          duracion: .duration,
          resultado: .result
        }' calls.json
