name: RingCentral Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:

      - name: Get Access Token
        run: |

          RESPONSE=$(curl -s -X POST "https://platform.ringcentral.com/restapi/oauth/token" \
          -u "${{ secrets.RINGCENTRAL_CLIENT_ID }}:${{ secrets.RINGCENTRAL_CLIENT_SECRET }}" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${{ secrets.RINGCENTRAL_JWT }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Get Call Summary
        run: |

          RESPONSE=$(curl -s \
          "https://platform.ringcentral.com/restapi/v1.0/account/~/extension/~/call-log?view=Simple" \
          -H "Authorization: Bearer $ACCESS_TOKEN")

          TOTAL=$(echo "$RESPONSE" | jq '.records | length')

          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Send Message
        run: |

          curl -s -X POST \
          "https://platform.ringcentral.com/restapi/v1.0/glip/chats/${{ secrets.RINGCENTRAL_CHAT_ID }}/posts" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"📞 Total de llamadas encontradas: $TOTAL\"}"
