name: RingCentral Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar KPI
        env:
          RINGCENTRAL_CLIENT_ID: ${{ secrets.RINGCENTRAL_CLIENT_ID }}
          RINGCENTRAL_CLIENT_SECRET: ${{ secrets.RINGCENTRAL_CLIENT_SECRET }}
          RINGCENTRAL_JWT: ${{ secrets.RINGCENTRAL_JWT }}
          RINGCENTRAL_CHAT_ID: ${{ secrets.RINGCENTRAL_CHAT_ID }}
          RINGCENTRAL_SMS_FROM: ${{ secrets.RINGCENTRAL_SMS_FROM }}
          RINGCENTRAL_SMS_TO: ${{ secrets.RINGCENTRAL_SMS_TO }}
        run: python kpi_departamentos.py
